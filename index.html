<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5fb">
  <title>My To-Do List</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 18px;
    }

    main {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 32px;
      border: 1px solid #e6e9f2;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px #1e2b4a12;
    }

    h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 38px); }
    .subtitle { margin: 0 0 26px; color: #697386; }
    form { display: flex; gap: 10px; }
    input, button { font: inherit; }

    #task-input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid #d6dbe7;
      border-radius: 10px;
      outline: none;
    }

    #task-input:focus {
      border-color: #536dfe;
      box-shadow: 0 0 0 3px #536dfe22;
    }

    button { border: 0; border-radius: 10px; cursor: pointer; }
    #add-button {
      padding: 13px 18px;
      background: #536dfe;
      color: white;
      font-weight: 700;
    }
    #add-button:hover { background: #4058e8; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 12px;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-button {
      padding: 7px 10px;
      background: transparent;
      color: #626c80;
      font-size: 14px;
    }
    .filter-button[aria-pressed="true"] {
      background: #eef0ff;
      color: #354bd1;
      font-weight: 700;
    }

    #clear-completed {
      padding: 7px 0 7px 8px;
      background: transparent;
      color: #697386;
      font-size: 14px;
    }
    #clear-completed:hover { color: #c03a50; }

    #task-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid #eceef4;
      border-radius: 11px;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #536dfe;
      cursor: pointer;
    }

    .task-text { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .task.completed .task-text { color: #9299a8; text-decoration: line-through; }

    .delete-button {
      padding: 5px 8px;
      background: transparent;
      color: #8b93a3;
      font-size: 18px;
      line-height: 1;
    }
    .delete-button:hover { background: #fff0f1; color: #c03a50; }

    #empty-message { padding: 28px 12px; color: #8991a1; text-align: center; }
    #task-count { margin: 18px 0 0; color: #7a8292; font-size: 14px; }

    @media (max-width: 460px) {
      body { padding: 20px 12px; }
      main { padding: 23px 17px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>My To-Do List</h1>
    <p class="subtitle">Keep track of what you need to get done.</p>

    <form id="task-form">
      <input
        id="task-input"
        type="text"
        placeholder="What needs doing?"
        maxlength="200"
        autocomplete="off"
        aria-label="New task"
        required
      >
      <button id="add-button" type="submit">Add task</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clear-completed" type="button">Clear completed</button>
    </div>

    <ul id="task-list" aria-label="Tasks"></ul>
    <p id="empty-message">No tasks here yet. Add one above!</p>
    <p id="task-count" aria-live="polite"></p>
  </main>

  <script>
    const STORAGE_KEY = "todo-list-tasks-v1";
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const emptyMessage = document.getElementById("empty-message");
    const taskCount = document.getElementById("task-count");
    const filterButtons = document.querySelectorAll(".filter-button");

    let tasks = loadTasks();
    let currentFilter = "all";

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved)
          ? saved.filter(task =>
              task &&
              typeof task.id === "string" &&
              typeof task.text === "string" &&
              typeof task.completed === "boolean"
            )
          : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch {
        taskCount.textContent = "Could not save tasks in this browser.";
      }
    }

    function render() {
      list.replaceChildren();

      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      for (const task of visibleTasks) {
        const item = document.createElement("li");
        item.className = `task${task.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark "${task.text}" as ${task.completed ? "active" : "completed"}`);
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          render();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `Delete "${task.text}"`);
        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
        });

        item.append(checkbox, text, deleteButton);
        list.append(item);
      }

      emptyMessage.hidden = visibleTasks.length > 0;
      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent = `${remaining} task${remaining === 1 ? "" : "s"} left`;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.push({
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        text,
        completed: false
      });

      input.value = "";
      saveTasks();
      render();
      input.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach(item => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        render();
      });
    });

    document.getElementById("clear-completed").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
