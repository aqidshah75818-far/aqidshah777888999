<script>
  const offer = document.getElementById('offer');
  const prank = document.getElementById('prank');
  const laugh = document.getElementById('laugh');
  function revealPrank() {
    offer.style.display = 'none';
    prank.style.display = 'block';
    laugh.currentTime = 0;
    laugh.play().catch(() => {
      document.getElementById('replay').textContent = 'TAP TO PLAY SOUND 🔊';
    });
  }
  document.getElementById('claim').addEventListener('click', revealPrank);
  document.getElementById('replay').addEventListener('click', () => {
    laugh.currentTime = 0;
    laugh.play();
  });
</script>
